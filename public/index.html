<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namae Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--azure:#006EFF;--pink:#FF3EA5;--pink-soft:#FFB3D9;--yellow:#FFD84D;--green:#1F9D55;--red:#B00020;--ink:#0A0A0A;--muted:#4A5568;--edge:rgba(0,110,255,.18);--shadow:0 1px 0 #fff inset,0 10px 28px rgba(0,60,160,.09),0 2px 6px rgba(0,60,160,.05)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0%,#fff 0,#E8F1FF 42%,#D3E5FF 100%);min-height:100vh;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 22px 40px}
.card{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow)}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;display:flex;align-items:center}
.logo img{height:46px;width:auto;display:block}
.title{font-weight:900;font-size:18px;color:var(--azure);font-stretch:125%}
.projname{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.tools{display:flex;gap:10px;align-items:center}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;min-height:0}
.icon svg{width:19px;height:19px;stroke:var(--azure);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.plus{background:var(--azure);border-color:var(--azure)}
.icon.plus svg{stroke:#fff}
.icon.on{background:#EAF3FF;border-color:var(--azure)}
.avatar{width:44px;height:44px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-weight:900;cursor:pointer;padding:0;min-height:0}
.icon:hover,.avatar:hover{transform:translateY(-2px)}
.busybar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--azure),transparent);z-index:9999;animation:busysweep 1.3s ease-in-out infinite}
.busytoast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#0A0A0A;color:#fff;padding:8px 18px 8px 14px;border-radius:999px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;max-width:92vw}
.thinkicon{flex:none;object-fit:contain}
.namesloading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:420px;text-align:center}
.namesloading-msg{font-size:15px;font-weight:700;color:#444}
.busydots span{animation:dotfade 1.3s ease-in-out infinite;opacity:.25}
.busydots span:nth-child(1){animation-delay:0s}
.busydots span:nth-child(2){animation-delay:.2s}
.busydots span:nth-child(3){animation-delay:.4s}
@keyframes busysweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes dotfade{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* buttons */
button{border:0;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.04em;min-height:38px;transition:transform .15s,box-shadow .15s,background .15s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 16px rgba(0,40,120,.15)}
button:active:not(:disabled){transform:translateY(0) scale(.98)}
button:disabled{opacity:.35;cursor:not-allowed}
.black{background:#000;color:#fff}.azure{background:var(--azure);color:#fff}.pink{background:var(--pink);color:#fff}
.ghost{background:#fff;border:1.5px solid var(--ink);color:var(--ink)}
.danger{background:#fff;border:1.5px solid var(--red);color:var(--red)}
.sm{min-height:32px;padding:6px 12px;font-size:11px}
.link{background:none;color:var(--muted);text-decoration:underline;padding:6px 4px;text-transform:none;letter-spacing:0;font-weight:600;min-height:0}

/* tabs & strip */
.tabs{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap;padding:8px 12px;border:1px dashed rgba(0,110,255,.5);border-radius:999px;background:rgba(255,255,255,.6);width:max-content;max-width:100%}
.tab{display:flex;align-items:center;gap:8px;padding:5px 16px 5px 5px;border-radius:999px;border:1.5px solid #000;background:transparent;color:var(--ink);font-size:12px;min-height:0}
.tab .n{width:24px;height:24px;border-radius:50%;border:1.5px solid #000;display:grid;place-items:center;background:#fff;font-weight:900;font-size:11px}
.tab.current{background:var(--azure);border-color:var(--azure);color:#fff}.tab.current .n{background:#fff;color:var(--azure);border-color:#fff}
.tab.done{background:var(--pink-soft);border-color:var(--pink)}.tab.done .n{background:var(--pink);color:#fff;border-color:var(--pink)}
.strip{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted);padding:2px 6px 10px}
.strip b{color:var(--ink)}
.strip .fin{color:#0E6B3A}

/* main */
.main{padding:26px 28px;min-height:560px;display:flex;flex-direction:column;gap:14px}
.display{margin:0;color:var(--azure);font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:clamp(24px,3vw,36px);line-height:1.05}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.lbl{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.end{justify-content:flex-end}
.bar{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
input,textarea,select{border:1.5px solid rgba(0,110,255,.3);border-radius:10px;padding:10px 14px;background:#fff;min-width:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--azure);box-shadow:0 0 0 4px rgba(0,110,255,.15)}
textarea{width:100%;min-height:130px;resize:vertical;font-size:16px;line-height:1.5;padding:14px 16px;background:rgba(255,255,255,.95)}
.mic{width:46px;height:46px;min-height:0;padding:0;border-radius:50%;background:var(--pink);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,62,165,.18)}
.mic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round}
.mic.on{animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,62,165,.55)}100%{box-shadow:0 0 0 18px rgba(255,62,165,0)}}
.block{background:#fff;border:1px solid var(--edge);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ok{border-color:var(--green)}

/* brief options */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{background:#fff;border:1.5px solid var(--edge);color:var(--ink);padding:14px;border-radius:10px;font-size:14px;text-align:center;min-height:0}
.opt.on{border-color:var(--azure);background:#EAF3FF;box-shadow:0 0 0 3px rgba(0,110,255,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1.5px solid var(--azure);color:var(--ink);padding:7px 14px;font-size:12px;min-height:0;text-transform:none;letter-spacing:0;font-weight:700}
.chip.on{background:var(--azure);color:#fff}
.chip.ai{border-color:var(--pink)}.chip.ai.on{background:var(--pink)}
.ref{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--edge);border-radius:999px;padding:5px 5px 5px 12px;font-size:13px;font-weight:700}
.ref button{padding:3px 9px;font-size:10px;min-height:0}
.like{background:#DDF6E7;color:#0E6B3A}.avoid{background:#FFD9E0;color:var(--red)}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input{flex:1;min-width:180px;max-width:360px}

/* directions */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.dtile{position:relative;overflow:hidden;background:#fff;border:1.5px solid var(--edge);border-radius:12px;min-height:120px;padding:18px;text-align:left;display:flex;align-items:flex-end;font-size:17px;font-weight:900;font-stretch:112%;text-transform:uppercase;color:var(--ink);box-shadow:var(--shadow)}
.dtile::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--c)}
.dtile.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.dtile.on::after{content:"✓";position:absolute;right:16px;top:14px;font-weight:900;color:var(--ink)}

/* names */
.count{font-size:13px;font-weight:800;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{position:relative;overflow:hidden;background:#fff;border:1px solid var(--edge);border-radius:12px;padding:18px 16px 14px 20px;min-height:96px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;color:var(--ink);box-shadow:var(--shadow);text-transform:none;letter-spacing:0;font-weight:400}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.tile .tn{font-size:22px;font-weight:900;font-stretch:118%;line-height:1.05;word-break:break-word}
.tile .td{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile:hover:not(:disabled){box-shadow:0 14px 30px rgba(0,60,160,.16)}
.empty{padding:20px;border:1.5px dashed rgba(0,110,255,.4);border-radius:10px;color:var(--muted);text-align:center}

/* detail */
.bigname{font-size:clamp(40px,6vw,62px);font-weight:900;font-stretch:120%;line-height:1;word-break:break-word}
.hero{border-left:6px solid var(--c);padding-left:16px;display:flex;flex-direction:column;gap:6px}
.hero .mean{font-size:15px;color:var(--muted)}
.var{background:#fff;border:1.5px solid var(--pink);color:var(--ink);padding:8px 14px;font-weight:900;font-stretch:112%;text-transform:none;letter-spacing:0;min-height:0;font-size:14px}
.preview{border-radius:10px;min-height:90px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EAF3FF,#FFF0F8);font-size:34px;font-weight:900;font-stretch:118%;word-break:break-word;padding:10px;text-align:center}
.preview.img{padding:0;overflow:hidden;background:#fff}
.preview.img img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.preview.err{background:#FFF0F0;color:var(--red);font-size:13px;font-weight:600;text-transform:none;font-stretch:normal}
.verdict{font-size:44px;font-weight:900;font-stretch:125%;line-height:1;padding:4px 0}
.verdict.Go{color:var(--green)}.verdict.Check{color:#8A6A00}.verdict.Stop{color:var(--red)}
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ptile{background:#F7FAFF;border:1px solid #E3ECFA;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--s,#CBD5E1)}
.ptile.Clear{--s:var(--green)}.ptile.Review{--s:#E7C900}.ptile.Blocked{--s:var(--red)}
.ptile .pl{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.ptile .ps{font-size:12px;color:var(--muted);line-height:1.35}
.pill{display:inline-block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;background:#EEF2F7;color:var(--muted);width:max-content}
.pill.Clear,.pill.Go,.pill.locked{background:#DDF6E7;color:#0E6B3A}
.pill.Review,.pill.Check,.pill.kept{background:#FFF3B0;color:#6B5200}
.pill.Blocked,.pill.Stop,.pill.rejected{background:#FFD9E0;color:var(--red)}
.pill.shortlisted{background:var(--pink);color:#fff}
.pill.suggested,.pill.Pending{background:#EEF2F7;color:var(--muted)}
.prosc{font-size:14px;line-height:1.7}
.pitems{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--ink);line-height:1.55}
.pnote{display:block;font-size:10px;color:#93A0B4;font-style:italic;margin-top:4px}
.dbwrap{display:flex;flex-direction:column;gap:6px;margin:4px 0 2px;padding:12px 14px;background:#fff;border:1px solid var(--edge);border-radius:10px}
.dbtrack{position:relative;height:10px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0%,#FF8A3D 25%,var(--yellow) 50%,#8FE3B0 75%,var(--green) 100%)}
.dbknob{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--azure);transform:translateX(-50%);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.dblabels{display:flex;justify-content:space-between;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.dbcaption{font-size:12px;font-weight:700;color:var(--ink)}
button.suggested{box-shadow:0 0 0 3px rgba(0,110,255,.35),0 0 14px rgba(0,110,255,.5);animation:sugglow 1.6s ease-in-out infinite}
@keyframes sugglow{0%,100%{box-shadow:0 0 0 3px rgba(0,110,255,.3),0 0 10px rgba(0,110,255,.4)}50%{box-shadow:0 0 0 5px rgba(0,110,255,.45),0 0 20px rgba(0,110,255,.65)}}
.visrow{display:flex;gap:10px;flex-wrap:wrap}
.visrow .preview{flex:1 1 30%;height:140px;min-height:0}
.bottombar{position:sticky;bottom:10px;margin-top:8px;background:rgba(255,255,255,.95);border:1px solid var(--edge);border-radius:999px;padding:8px 10px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;box-shadow:0 12px 26px rgba(0,60,160,.16)}

/* shortlist, library */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--edge);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:var(--shadow);color:var(--ink);text-transform:none;letter-spacing:0;font-weight:400;min-height:0}
.pcard.final{border-color:var(--green);background:linear-gradient(180deg,#fff,#E9FFF1)}
.pcard .bn{font-size:24px;font-weight:900;font-stretch:118%;line-height:1.05;word-break:break-word}
.pcard .meta{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;gap:6px;padding:4px;border-radius:999px;background:#EAF2FF}
.seg button{background:transparent;padding:7px 14px;min-height:0;font-size:11px;box-shadow:none}
.seg button.on{background:#fff;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--edge)}
td{padding:10px;border-bottom:1px solid #E3ECFA}
.admin input,.admin select{padding:7px 10px;font-size:13px}
.krow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #E3ECFA}
.krow .lbl{min-width:170px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#000;color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
.login{max-width:380px;margin:12vh auto 0;padding:30px;display:flex;flex-direction:column;gap:12px}
.login input{padding:12px 14px}
@media (max-width:860px){.opts,.dgrid,.ptiles,.split2{grid-template-columns:1fr}.title,.projname{display:none}.main{padding:20px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ constants ============ */
const ICON = {
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  lib: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="M17 5l3 1-3 14-3-1z"/></svg>',
  mic: '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>'
};
const KEY_LABEL = {gemini:'AI (Gemini)', euipo_client_id:'EUIPO client ID', euipo_client_secret:'EUIPO client secret', uspto:'USPTO key', whoisxml:'WhoisXML key'};
const SOURCE_LABEL = {rdap:'Domain (RDAP)', llm:'AI checks', euipo:'EUIPO trademark', uspto:'USPTO trademark', whoisxml:'WhoisXML domains'};
const TABS = [['brief','Brief'],['directions','Directions'],['names','Names'],['shortlist','Shortlist']];

/* ============ state ============ */
const S = {
  token: localStorage.getItem('ns-token') || '', me: null, projects: [], currentId: null,
  catalog: {dirs:[], markets:[], classes:[], segments:[], params:[]}, uiText: {}, llmReady: false,
  view: 'login', selected: null, libMode: 'projects', accTab: 'profile', adminTab: 'users',
  admin: { users: [], logs: [], logUser: '', config: null }, busy: false, busyMsg: '', namesLoading: false
};
let rec = null, listening = false;

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = k => S.uiText[k] || k;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function P(){ return S.projects.find(p => p.id === S.currentId) || S.projects[0]; }
function N(id, p = P()){ return p && p.names.find(n => n.id === id); }
function upsert(p){ const i = S.projects.findIndex(x => x.id === p.id); if (i > -1) S.projects[i] = p; else S.projects.unshift(p); }
function visibleNames(p = P()){ return p.names.filter(n => n.status !== 'rejected' && (n.dir === 'custom' || p.dirs.includes(n.dir))); }
function suggestions(p = P()){ return visibleNames(p).filter(n => n.status === 'suggested' || n.status === 'kept'); }
function shortlisted(p = P()){ return p.names.filter(n => n.status === 'shortlisted' || n.status === 'locked'); }
function tabEnabled(id){
  const p = P();
  return {brief:true, directions:p.confirmed, names:p.dirs.length>0, shortlist:shortlisted(p).length>0}[id];
}
function doLogout(){ S.token=''; S.me=null; localStorage.removeItem('ns-token'); S.view='login'; }

async function api(method, path, body){
  const r = await fetch('/api'+path, {
    method, headers: {'content-type':'application/json', ...(S.token?{authorization:'Bearer '+S.token}:{})},
    body: body ? JSON.stringify(body) : undefined
  });
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (r.status === 401 && path !== '/login') { doLogout(); throw new Error('Please sign in again'); }
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}
async function act(fn, msg){ S.busy = true; S.busyMsg = msg || 'Working…'; render(); try { await fn(); } catch(e) { toast(e.message); } S.busy = false; render(); }

/* ============ boot ============ */
async function boot(){
  if (!S.token) { S.view = 'login'; return render(); }
  try {
    const b = await api('GET', '/bootstrap');
    Object.assign(S, {me:b.me, projects:b.projects, catalog:b.catalog, uiText:b.uiText, llmReady:b.llmReady});
    if (!S.projects.length) upsert(await api('POST', '/projects', {}));
    S.currentId = S.projects[0].id; S.view = 'brief';
  } catch(e) { S.view = 'login'; }
  render();
}

/* ============ render ============ */
function render(){
  if (S.view === 'login') { $('#app').innerHTML = loginHTML(); return; }
  const p = P();
  const admin = S.me && S.me.role === 'admin';
  const onProject = ['brief','directions','names','detail','shortlist'].includes(S.view);
  $('#app').innerHTML = `
    ${(S.busy && !S.namesLoading) ? `<div class="busybar"></div><div class="busytoast"><img class="thinkicon" src="assets/loading-pencil.gif" width="26" height="26" alt=""><span>${esc((S.busyMsg||'Working').replace(/[.…\s]+$/,''))}<span class="busydots"><span>.</span><span>.</span><span>.</span></span></span></div>` : ''}
    <header class="card top">
      <div class="brand"><div class="logo"><img src="assets/logo.png" alt="Sky Blue"></div>
        <div><div class="title">NAMAE STUDIO</div><div class="projname">${esc(p.name)}</div></div></div>
      <div class="tools">
        <button class="icon plus" data-act="new-project" title="New project" aria-label="New project">${ICON.plus}</button>
        <button class="icon ${S.view==='library'?'on':''}" data-act="view" data-view="library" title="Library" aria-label="Library">${ICON.lib}</button>
        <button class="avatar" data-act="view" data-view="account" title="Account" aria-label="Account">${esc((S.me?.name||'A').charAt(0).toUpperCase())}</button>
      </div>
    </header>
    ${onProject ? tabsHTML() + stripHTML(p) : ''}
    <main class="card main">${views[S.view] ? views[S.view]() : ''}</main>
  `;

// Scores the research card into a Poor..Excellent band (fraction of checks that came back
// Clear), and names the shortlist action that band points to - purely informational, the person
// still has to click the button themselves, but the matching button glows to flag the suggestion.
function decisionInfo(r){
  const total = r.results.length || 1;
  const clear = r.results.filter(x => x.status === 'Clear').length;
  const blocked = r.results.some(x => x.status === 'Blocked');
  const frac = blocked ? 0 : clear / total;
  const bands = [
    { max: .2, label: 'Poor', action: 'rejected' },
    { max: .4, label: 'Fair', action: 'kept' },
    { max: .6, label: 'Good', action: 'kept' },
    { max: .8, label: 'Very good', action: 'shortlisted' },
    { max: 1.001, label: 'Excellent', action: 'locked' }
  ];
  const band = bands.find(b => frac <= b.max) || bands[bands.length - 1];
  return { pct: Math.round(frac * 100), label: band.label, action: band.action };
}

  return `<div class="dbwrap">

/* ============ voice ============ */
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice works in Chrome or Edge.'); return; }
  if (listening) { rec && rec.stop(); return; }
  rec = new SR(); rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = e => {
    let t = ''; for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
    const p = P(); p.brief = (p.brief + ' ' + t).trim();
    const ta = document.querySelector('[data-save="brief"]'); if (ta) ta.value = p.brief;
  };
  rec.onend = async () => {
    listening = false;
    const p = P();
    try { upsert(await api('PUT', `/projects/${p.id}`, {brief: p.brief})); } catch(e) { toast(e.message); }
    render();
  };
  rec.onerror = () => { listening = false; toast('Mic stopped.'); render(); };
  rec.start(); listening = true; render();
}

/* ============ actions ============ */
async function doAct(a, t){
  const p = P();
  const save = body => api('PUT', `/projects/${p.id}`, body).then(upsert);
  switch (a) {
    case 'view': S.view = t.dataset.view; if (S.view !== 'detail') S.selected = S.selected; break;
    case 'goto-names': {
      S.view = 'names'; S.namesLoading = true; render();
      try { upsert(await api('POST', `/projects/${p.id}/names`, {action:'regenerate'})); }
      catch(e) { toast(e.message); }
      S.namesLoading = false;
      break;
    }
    case 'mic': return toggleMic();
    case 'understand': {
      const r = await api('POST', `/projects/${p.id}/understand`, {text: p.brief});
      upsert(r.project);
      if (!r.connected) toast(r.aiError ? ('AI error: ' + r.aiError) : 'AI is off. Write the understanding by hand.');
      break;
    }
    case 'cancel-restate': upsert(await save({restating:false})); break;
    case 'confirm': {
      const ta = document.querySelector('[data-save="restatement"]');
      const text = ta ? ta.value : p.restatement;
      if (text.trim().length < 10) { toast('Write one or two sentences first.'); return; }
      upsert(await save({restatement:text, confirmed:true, restating:false}));
      if (S.llmReady) {
        for (const f of ['classes','segments']) {
          try { upsert(await api('POST', `/projects/${p.id}/suggest`, {field:f})); } catch(e) { toast(e.message); }
        }
        try { upsert(await api('POST', `/projects/${p.id}/directions/suggest`)); } catch(e) { toast(e.message); }
      }
      break;
    }
    case 'edit-brief': upsert(await save({confirmed:false, restating:true})); break;
    case 'set-market': upsert(await save({market:t.dataset.val})); break;
    case 'toggle-class': {
      const v=t.dataset.val; upsert(await save({classes: p.classes.includes(v) ? p.classes.filter(x=>x!==v) : [...p.classes, v]})); break;
    }
    case 'toggle-seg': {
      const v=t.dataset.val; upsert(await save({segments: p.segments.includes(v) ? p.segments.filter(x=>x!==v) : [...p.segments, v]})); break;
    }
    case 'add-class': {
      const v=($('#clsin')?.value||'').trim(); if(!v) return;
      upsert(await save({classes:[...new Set([...p.classes, v])]})); break;
    }
    case 'add-seg': {
      const v=($('#segin')?.value||'').trim(); if(!v) return;
      upsert(await save({segments:[...new Set([...p.segments, v])]})); break;
    }
    case 'add-ref': {
      const v=($('#refin')?.value||'').trim(); if(!v) return;
      upsert(await save({refs:[...p.refs, {v, t:'like'}]})); break;
    }
    case 'toggle-ref': upsert(await save({refs: p.refs.map((r,i)=> i==+t.dataset.i ? {v:r.v, t:r.t==='like'?'avoid':'like'} : r)})); break;
    case 'rm-ref': upsert(await save({refs: p.refs.filter((_,i)=> i!==+t.dataset.i)})); break;
    case 'dir': {
      const id=t.dataset.id;
      upsert(await save({dirs: p.dirs.includes(id) ? p.dirs.filter(x=>x!==id) : [...p.dirs, id]})); break;
    }
    case 'reshuffle': upsert(await api('POST', `/projects/${p.id}/names`, {action:'reshuffle'})); break;
    case 'more': upsert(await api('POST', `/projects/${p.id}/names`, {action:'more'})); break;
    case 'add-own': {
      const v=($('#own')?.value||'').trim(); if(!v) return;
      upsert(await api('POST', `/projects/${p.id}/names`, {action:'own', n:v})); break;
    }
    case 'open': S.selected = t.dataset.id; S.view = 'detail'; break;
    case 'open-variant': {
      const parent = N(S.selected); const v = t.dataset.val;
      const existing = p.names.find(x => x.n.toLowerCase() === v.toLowerCase());
      if (existing) { S.selected = existing.id; break; }
      const q = await api('POST', `/projects/${p.id}/names`, {action:'own', n:v, m:`Variation of ${parent.n}.`, dir:parent.dir, parent:parent.id});
      upsert(q); const nn = q.names.find(x => x.n.toLowerCase() === v.toLowerCase()); if (nn) S.selected = nn.id;
      break;
    }
    case 'similar': case 'newel':
      upsert(await api('POST', `/projects/${p.id}/names/${S.selected}/variations`, {kind: a==='newel'?'new':'similar'})); break;
    case 'visualise':
      upsert(await api('POST', `/projects/${p.id}/names/${S.selected}/visualise`, {style: $('#visdir').value.trim()})); break;
    case 'research': upsert(await api('POST', `/projects/${p.id}/names/${S.selected}/research`)); break;
    case 'set-status': {
      const v = t.dataset.val;
      upsert(await api('PATCH', `/projects/${p.id}/names/${S.selected}`, {status:v}));
      if (v === 'rejected') { S.selected = null; S.view = 'names'; }
      break;
    }
    case 'finalise': upsert(await api('PATCH', `/projects/${p.id}/names/${t.dataset.id}`, {status:'locked'})); break;
    case 'clear-final': { const n = N(p.final); if (n) upsert(await api('PATCH', `/projects/${p.id}/names/${n.id}`, {status:'shortlisted'})); break; }
    case 'new-project': { const q = await api('POST', '/projects', {}); upsert(q); S.currentId = q.id; S.view = 'brief'; S.selected = null; break; }
    case 'open-project': S.currentId = t.dataset.id; S.selected = null; S.view = 'names'; break;
    case 'lib-mode': S.libMode = t.dataset.val; break;
    case 'del-project': {
      if (!confirm('Delete this project and its names?')) return;
      await api('DELETE', `/projects/${t.dataset.id}`);
      S.projects = S.projects.filter(x => x.id !== t.dataset.id);
      if (!S.projects.length) S.projects = [await api('POST', '/projects', {})];
      S.currentId = S.projects[0].id; break;
    }
    case 'acc-tab': S.accTab = t.dataset.val; S.view = 'account'; if (S.accTab === 'admin') await loadAdmin(); break;
    case 'admin-tab': S.adminTab = t.dataset.val; if (S.adminTab === 'activity') await loadLogs(); break;
    case 'user-add': {
      await api('POST', '/admin/users', {email:$('#nu-email').value, name:$('#nu-name').value, role:$('#nu-role').value, password:$('#nu-pw').value});
      toast('User added'); await loadAdmin(); break;
    }
    case 'user-active': await api('PATCH', `/admin/users/${t.dataset.id}`, {active: t.dataset.val === 'true'}); await loadAdmin(); break;
    case 'user-pw': {
      const pw = document.querySelector(`[data-upw="${t.dataset.id}"]`).value;
      await api('PATCH', `/admin/users/${t.dataset.id}`, {password: pw}); toast('Password set'); break;
    }
    case 'clear-key': S.admin.config = await api('PUT', '/admin/config', {clear:[t.dataset.val]}); break;
    case 'test': {
      const r = await api('POST', `/admin/test/${t.dataset.val}`);
      const el = $('#test-' + t.dataset.val); if (el) el.textContent = r.message; break;
    }
    case 'save-config': {
      const keys = {}; document.querySelectorAll('[data-key]').forEach(i => { if (i.value.trim()) keys[i.dataset.key] = i.value.trim(); });
      const sources = {}; document.querySelectorAll('[data-src]').forEach(i => { sources[i.dataset.src] = i.checked; });
      S.admin.config = await api('PUT', '/admin/config', {keys, sources, llm:{model: $('#llmModel').value}});
      S.llmReady = S.admin.config.llmReady; toast('Saved'); break;
    }
    case 'save-text': {
      const uiText = {}; document.querySelectorAll('[data-text]').forEach(i => { uiText[i.dataset.text] = i.value; });
      S.uiText = await api('PUT', '/admin/ui-text', {uiText});
      S.admin.config = await api('GET', '/admin/config'); toast('Text saved'); break;
    }
    case 'logout': await api('POST', '/logout').catch(() => {}); doLogout(); break;
  }
}

/* ============ events ============ */
const BUSY_MSG = {
  dir: 'Saving…', reshuffle: 'Shuffling…', more: 'Generating more names…',
  research: 'Running research…', visualise: 'Generating image…',
  understand: 'Thinking…', confirm: 'Getting suggestions…', 'goto-names': 'Generating names…'
};
document.addEventListener('click', e => {
  if (S.busy) return;
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  if (t.dataset.act === 'open-project' && t.tagName === 'ARTICLE' && e.detail === 0) {}
  act(() => doAct(t.dataset.act, t), BUSY_MSG[t.dataset.act]);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const map = {own:'add-own', refin:'add-ref', segin:'add-seg', clsin:'add-class'};
  if (map[e.target.id]) { e.preventDefault(); act(() => doAct(map[e.target.id], e.target)); }
  if (e.target.matches && e.target.matches('.pcard[data-act]')) { act(() => doAct('open-project', e.target)); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.save === undefined && t.dataset.pname === undefined && !t.dataset.uname && !t.dataset.urole && t.dataset.logsel === undefined) return;
  act(async () => {
    if (t.dataset.save) { const body = {}; body[t.dataset.save] = t.value; upsert(await api('PUT', `/projects/${P().id}`, body)); }
    else if (t.dataset.pname !== undefined) { S.me = await api('PUT', '/me', {name: t.value}); }
    else if (t.dataset.uname) { await api('PATCH', `/admin/users/${t.dataset.uname}`, {name: t.value}); S.admin.users = await api('GET','/admin/users'); }
    else if (t.dataset.urole) { await api('PATCH', `/admin/users/${t.dataset.urole}`, {role: t.value}); S.admin.users = await api('GET','/admin/users'); }
    else if (t.dataset.logsel !== undefined) { S.admin.logUser = t.value; await loadLogs(); }
  });
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'login') return;
  e.preventDefault();
  const f = new FormData(e.target);
  act(async () => {
    const r = await api('POST', '/login', {email: f.get('email'), password: f.get('password')});
    S.token = r.token; localStorage.setItem('ns-token', r.token);
    await boot();
  });
});

boot();
</script>
</body>
</html>
